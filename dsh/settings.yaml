ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1

# Default model route (shared by web / headless / API entry points).
# To fall back to DeepSeek: set provider: deepseek-official, model: deepseek-v4-flash
agent-default-model:
  provider: zenmux
  model: deepseek/deepseek-v4.1-flash
  reasoningEffort: high

llm-pi-ai:
  providers:
    vllm:
      displayName: vLLM (local)
      apiKeyEnv: LLAMA_API_KEY
      api: openai-completions
      # Reverse-proxied endpoint (nip.io -> fixed IP), TLS terminated at the proxy
      baseURL: https://llm.cebd5f41.nip.io/v1
      models:
        # Translated from pi/agent/models.json (muse-rocm entry)
        - id: qwen3.8-27b
          name: Qwen3.8 27B (vLLM)
          contextWindow: 131072
          input: [ text ]
          reasoningEfforts:
            off: # null = thinking disabled
            minimal: low
            low: low
            medium: medium
            high: xhigh
            xhigh: xhigh
            max: xhigh
