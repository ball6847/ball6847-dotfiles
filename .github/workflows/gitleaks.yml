name: Gitleaks Secret Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    # security-events: write kept to enable future code scanning integration
    # GitHub Security-tab code scanning integration is deferred (TC-06)
    # gitleaks/gitleaks-action@v2 uploads SARIF artifact by default (GITLEAKS_ENABLE_UPLOAD_ARTIFACT=true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
